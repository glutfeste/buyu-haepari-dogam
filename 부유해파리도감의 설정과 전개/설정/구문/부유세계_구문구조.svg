<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" font-family="-apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <style>
    text{ fill:#3a2f1c; }
    .ttl{ font-size:22px; font-weight:700; }
    .stl{ font-size:13.5px; fill:#6b5d42; }
    .l{ font-size:15px; font-weight:700; }
    .s{ font-size:12.5px; }
    .cn{ font-size:14px; font-weight:700; fill:#3c3470; }
    .ce{ font-size:11px; fill:#5a5285; }
  </style>
  <rect x="0" y="0" width="720" height="412" fill="#f5edda"/>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5b4a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#a3331f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text class="ttl" x="40" y="46">구문의 구조</text>
  <text class="stl" x="40" y="68">두뇌가 곧 계산기 — 매체는 구문을 적은 기록</text>

  <rect x="40" y="96" width="190" height="72" rx="10" fill="#cdeae0" stroke="#1d9e75" stroke-width="1.5"/>
  <text class="l" x="135" y="127" text-anchor="middle" fill="#0f6e56">매체</text>
  <text class="s" x="135" y="150" text-anchor="middle" fill="#0f6e56">구문을 적은 기록</text>

  <line x1="230" y1="132" x2="258" y2="132" stroke="#5b4a2e" stroke-width="2" marker-end="url(#ad)"/>

  <rect x="260" y="96" width="150" height="72" rx="10" fill="#d9d2f2" stroke="#6b5fb0" stroke-width="1.5"/>
  <text class="l" x="335" y="127" text-anchor="middle" fill="#3c3470">두뇌</text>
  <text class="s" x="335" y="150" text-anchor="middle" fill="#3c3470">구문을 계산</text>

  <line x1="410" y1="132" x2="438" y2="132" stroke="#5b4a2e" stroke-width="2" marker-end="url(#ad)"/>

  <rect x="440" y="96" width="230" height="72" rx="10" fill="#d9d2f2" stroke="#6b5fb0" stroke-width="1.5"/>
  <text class="l" x="555" y="127" text-anchor="middle" fill="#3c3470">구문의 효과</text>
  <text class="s" x="555" y="150" text-anchor="middle" fill="#3c3470">현실로 나타남</text>

  <text class="stl" x="40" y="196">효과는 일으키는 물리 과정에 따라 여섯으로 나뉜다</text>

  <rect x="40" y="210" width="100" height="50" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.3"/>
  <text class="cn" x="90" y="233" text-anchor="middle">증폭</text>
  <text class="ce" x="90" y="250" text-anchor="middle">근력·속도·경도</text>

  <rect x="148" y="210" width="100" height="50" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.3"/>
  <text class="cn" x="198" y="233" text-anchor="middle">방출</text>
  <text class="ce" x="198" y="250" text-anchor="middle">불·빛·전기</text>

  <rect x="256" y="210" width="100" height="50" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.3"/>
  <text class="cn" x="306" y="233" text-anchor="middle">변성</text>
  <text class="ce" x="306" y="250" text-anchor="middle">쇠→유리·치유</text>

  <rect x="364" y="210" width="100" height="50" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.3"/>
  <text class="cn" x="414" y="233" text-anchor="middle">관측</text>
  <text class="ce" x="414" y="250" text-anchor="middle">감지·예측</text>

  <rect x="472" y="210" width="100" height="50" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.3"/>
  <text class="cn" x="522" y="233" text-anchor="middle">사역</text>
  <text class="ce" x="522" y="250" text-anchor="middle">신호 써넣기</text>

  <rect x="580" y="210" width="100" height="50" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.3"/>
  <text class="cn" x="630" y="233" text-anchor="middle">부여</text>
  <text class="ce" x="630" y="250" text-anchor="middle">기물에 기능</text>

  <rect x="40" y="300" width="380" height="92" rx="10" fill="#e7e0d0" stroke="#9b8f73" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="l" x="62" y="330" fill="#4a4232">이론상의 구문</text>
  <text class="s" x="62" y="354" fill="#4a4232">사람 두뇌로는 벅참</text>
  <text class="s" x="62" y="376" fill="#4a4232">예: 산을 들어 올리기</text>

  <rect x="498" y="310" width="182" height="78" rx="10" fill="#f3c7be" stroke="#a3331f" stroke-width="1.5"/>
  <text class="l" x="589" y="341" text-anchor="middle" fill="#7a2415">차분기관</text>
  <text class="s" x="589" y="364" text-anchor="middle" fill="#7a2415">두뇌 대신 계산</text>

  <line x1="492" y1="349" x2="424" y2="349" stroke="#a3331f" stroke-width="2" marker-end="url(#ar)"/>
  <text class="s" x="456" y="339" text-anchor="middle" fill="#7a2415">한계 돌파</text>
</svg>
