<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="-apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <style>
    text{fill:#352d20}
    .ttl{font-size:22px;font-weight:700}
    .stl{font-size:13px;fill:#665a45}
    .l{font-size:15px;font-weight:700}
    .s{font-size:12px}
    .a{stroke:#5b4a2e;stroke-width:2;fill:none}
  </style>
  <rect width="840" height="470" fill="#f5edda"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5b4a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="ttl" x="40" y="44">구문의 실행 구조</text>
  <text class="stl" x="40" y="67">배열을 보존한 매체, 배열을 평가하는 연산체, 실제 대상을 지정하는 결속, 물리 변화를 공급하는 힘</text>

  <rect x="40" y="100" width="170" height="78" rx="10" fill="#cdeae0" stroke="#1d9e75" stroke-width="1.5"/>
  <text class="l" x="125" y="130" text-anchor="middle">매체</text>
  <text class="s" x="125" y="151" text-anchor="middle">은판·태엽·체내 기록체</text>
  <text class="s" x="125" y="168" text-anchor="middle">거미줄·댐·균사망</text>

  <line class="a" x1="210" y1="139" x2="252" y2="139" marker-end="url(#arrow)"/>

  <rect x="255" y="100" width="180" height="78" rx="10" fill="#d9d2f2" stroke="#6b5fb0" stroke-width="1.5"/>
  <text class="l" x="345" y="130" text-anchor="middle">연산체</text>
  <text class="s" x="345" y="151" text-anchor="middle">두뇌·분산 신경망</text>
  <text class="s" x="345" y="168" text-anchor="middle">균사망·차분기관</text>

  <line class="a" x1="435" y1="139" x2="477" y2="139" marker-end="url(#arrow)"/>

  <rect x="480" y="100" width="150" height="78" rx="10" fill="#f1dfb8" stroke="#b4842e" stroke-width="1.5"/>
  <text class="l" x="555" y="130" text-anchor="middle">대상 결속</text>
  <text class="s" x="555" y="151" text-anchor="middle">대상·위치·범위</text>
  <text class="s" x="555" y="168" text-anchor="middle">현재 입력과 대응</text>

  <line class="a" x1="630" y1="139" x2="672" y2="139" marker-end="url(#arrow)"/>

  <rect x="675" y="100" width="125" height="78" rx="10" fill="#f3c7be" stroke="#a3331f" stroke-width="1.5"/>
  <text class="l" x="737.5" y="130" text-anchor="middle">산출</text>
  <text class="s" x="737.5" y="151" text-anchor="middle">공급된 힘으로</text>
  <text class="s" x="737.5" y="168" text-anchor="middle">구조를 실현</text>

  <rect x="255" y="220" width="180" height="72" rx="10" fill="#e7e0d0" stroke="#8f8268" stroke-width="1.5"/>
  <text class="l" x="345" y="249" text-anchor="middle">실행 상태</text>
  <text class="s" x="345" y="270" text-anchor="middle">전기·화학 신호와 기계 운동</text>

  <line class="a" x1="345" y1="220" x2="345" y2="182" marker-end="url(#arrow)"/>

  <rect x="480" y="220" width="150" height="72" rx="10" fill="#dfe9f2" stroke="#47789c" stroke-width="1.5"/>
  <text class="l" x="555" y="249" text-anchor="middle">힘</text>
  <text class="s" x="555" y="270" text-anchor="middle">대사·동력·수압·낙차</text>

  <line class="a" x1="630" y1="256" x2="737" y2="182" marker-end="url(#arrow)"/>

  <text class="stl" x="40" y="335">산출되는 물리 과정</text>

  <g>
    <rect x="40" y="355" width="112" height="54" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.2"/>
    <text class="l" x="96" y="379" text-anchor="middle">증폭</text>
    <text class="s" x="96" y="398" text-anchor="middle">물리량 증대</text>
  </g>
  <g>
    <rect x="164" y="355" width="112" height="54" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.2"/>
    <text class="l" x="220" y="379" text-anchor="middle">방출</text>
    <text class="s" x="220" y="398" text-anchor="middle">에너지·물질</text>
  </g>
  <g>
    <rect x="288" y="355" width="112" height="54" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.2"/>
    <text class="l" x="344" y="379" text-anchor="middle">변성</text>
    <text class="s" x="344" y="398" text-anchor="middle">성질·조직 배열</text>
  </g>
  <g>
    <rect x="412" y="355" width="112" height="54" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.2"/>
    <text class="l" x="468" y="379" text-anchor="middle">관측</text>
    <text class="s" x="468" y="398" text-anchor="middle">상태 판독</text>
  </g>
  <g>
    <rect x="536" y="355" width="112" height="54" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.2"/>
    <text class="l" x="592" y="379" text-anchor="middle">사역</text>
    <text class="s" x="592" y="398" text-anchor="middle">신경 신호 기입</text>
  </g>
  <g>
    <rect x="660" y="355" width="140" height="54" rx="9" fill="#e4def5" stroke="#6b5fb0" stroke-width="1.2"/>
    <text class="l" x="730" y="379" text-anchor="middle">부여</text>
    <text class="s" x="730" y="398" text-anchor="middle">사물의 조건 실행</text>
  </g>
</svg>
