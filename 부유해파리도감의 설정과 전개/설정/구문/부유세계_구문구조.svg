<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <style>
    text{fill:#332b20}
    .ttl{font-size:25px;font-weight:700}
    .sub{font-size:13.5px;fill:#675c49}
    .lane{font-size:16px;font-weight:700}
    .boxh{font-size:15px;font-weight:700}
    .boxs{font-size:12.5px}
    .note{font-size:12px;fill:#675c49}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5d4f3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9d3d29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#f6efdf"/>
  <text class="ttl" x="44" y="44">구문의 저장과 실행</text>
  <text class="sub" x="44" y="68">구문은 절차의 배열이며, 매체가 배열을 보존하고 연산망이 호출 관계를 평가한다</text>

  <text class="lane" x="44" y="112">기재 구문</text>
  <rect x="44" y="128" width="190" height="78" rx="10" fill="#cae8df" stroke="#268466" stroke-width="1.5"/>
  <text class="boxh" x="139" y="158" text-anchor="middle" fill="#17654f">외부 매체</text>
  <text class="boxs" x="139" y="181" text-anchor="middle" fill="#17654f">태엽·은판·악보·부적</text>
  <line x1="234" y1="167" x2="276" y2="167" stroke="#5d4f3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="278" y="128" width="202" height="78" rx="10" fill="#ded8f2" stroke="#6c60ad" stroke-width="1.5"/>
  <text class="boxh" x="379" y="158" text-anchor="middle" fill="#433a80">사람의 두뇌</text>
  <text class="boxs" x="379" y="181" text-anchor="middle" fill="#433a80">대상 결속 · 배열 연산</text>
  <line x1="480" y1="167" x2="522" y2="167" stroke="#5d4f3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="524" y="128" width="190" height="78" rx="10" fill="#ded8f2" stroke="#6c60ad" stroke-width="1.5"/>
  <text class="boxh" x="619" y="158" text-anchor="middle" fill="#433a80">구문의 효과</text>
  <text class="boxs" x="619" y="181" text-anchor="middle" fill="#433a80">구조가 세계에 실현</text>
  <text class="note" x="738" y="158">임의의 대상과 규모 지정</text>
  <text class="note" x="738" y="180">배열 제작·개량·전수</text>

  <text class="lane" x="44" y="260">생득 구문</text>
  <rect x="44" y="276" width="150" height="84" rx="10" fill="#f1dfb8" stroke="#a57a2f" stroke-width="1.5"/>
  <text class="boxh" x="119" y="306" text-anchor="middle" fill="#75531a">유전 물질</text>
  <text class="boxs" x="119" y="329" text-anchor="middle" fill="#75531a">세대 간 발생 기록</text>
  <line x1="194" y1="318" x2="226" y2="318" stroke="#5d4f3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="228" y="276" width="150" height="84" rx="10" fill="#f1dfb8" stroke="#a57a2f" stroke-width="1.5"/>
  <text class="boxh" x="303" y="306" text-anchor="middle" fill="#75531a">발생</text>
  <text class="boxs" x="303" y="329" text-anchor="middle" fill="#75531a">고정 회로를 형성</text>
  <line x1="378" y1="318" x2="410" y2="318" stroke="#5d4f3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="412" y="266" width="252" height="104" rx="10" fill="#d5e5f2" stroke="#477a9d" stroke-width="1.5"/>
  <text class="boxh" x="538" y="296" text-anchor="middle" fill="#2c5c7b">생체 회로</text>
  <text class="boxs" x="538" y="320" text-anchor="middle" fill="#2c5c7b">고정 연결: 배열을 보존</text>
  <text class="boxs" x="538" y="344" text-anchor="middle" fill="#2c5c7b">전기·화학 신호: 배열을 연산</text>
  <line x1="664" y1="318" x2="696" y2="318" stroke="#5d4f3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="698" y="276" width="176" height="84" rx="10" fill="#ded8f2" stroke="#6c60ad" stroke-width="1.5"/>
  <text class="boxh" x="786" y="306" text-anchor="middle" fill="#433a80">고정된 효과</text>
  <text class="boxs" x="786" y="329" text-anchor="middle" fill="#433a80">자기 몸·연결 군체</text>
  <text class="note" x="412" y="392">회로의 물리적 위치가 작용 대상을 지정하여 매개변수 결속 연산을 줄인다</text>

  <text class="lane" x="44" y="446">차분기관을 이용한 기재 구문</text>
  <rect x="44" y="462" width="170" height="70" rx="10" fill="#cae8df" stroke="#268466" stroke-width="1.5"/>
  <text class="boxh" x="129" y="491" text-anchor="middle" fill="#17654f">외부 매체</text>
  <text class="boxs" x="129" y="514" text-anchor="middle" fill="#17654f">배열 기록</text>
  <line x1="214" y1="497" x2="246" y2="497" stroke="#5d4f3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="248" y="462" width="180" height="70" rx="10" fill="#ded8f2" stroke="#6c60ad" stroke-width="1.5"/>
  <text class="boxh" x="338" y="491" text-anchor="middle" fill="#433a80">사람의 두뇌</text>
  <text class="boxs" x="338" y="514" text-anchor="middle" fill="#433a80">개시 절차</text>
  <line x1="428" y1="497" x2="460" y2="497" stroke="#9d3d29" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="462" y="452" width="192" height="90" rx="10" fill="#f2c9c0" stroke="#a34531" stroke-width="1.5"/>
  <text class="boxh" x="558" y="486" text-anchor="middle" fill="#7b2d1e">차분기관</text>
  <text class="boxs" x="558" y="510" text-anchor="middle" fill="#7b2d1e">방대한 실행 절차</text>
  <line x1="654" y1="497" x2="686" y2="497" stroke="#9d3d29" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="688" y="462" width="186" height="70" rx="10" fill="#ded8f2" stroke="#6c60ad" stroke-width="1.5"/>
  <text class="boxh" x="781" y="491" text-anchor="middle" fill="#433a80">구문의 효과</text>
  <text class="boxs" x="781" y="514" text-anchor="middle" fill="#433a80">처리 한계 확장</text>
</svg>
