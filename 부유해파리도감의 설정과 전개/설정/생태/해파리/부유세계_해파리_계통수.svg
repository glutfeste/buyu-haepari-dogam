  <text x="800" y="309" class="sp">안개·잔안개</text>

  <path class="line" d="M700,365 V990"/>
  <path class="line" d="M700,380 H790"/>
  <path class="line" d="M700,430 H790"/>
  <path class="likely" d="M700,480 H790"/>
  <path class="likely" d="M700,530 H790"/>
