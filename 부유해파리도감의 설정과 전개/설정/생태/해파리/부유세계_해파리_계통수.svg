  <text x="24" y="1004" class="note">실선은 확립된 분기, 점선은 유력한 분기를 뜻한다. 종별 위치는 형태·발생·자포낭형·생체 구문과 외군 비교를 함께 사용한다.</text>
  <text x="24" y="1024" class="note">초판의 미확정형은 계통수에서 제외하며 새 표본이 확보되면 분기와 확실도를 다시 계산한다.</text>
</svg>
