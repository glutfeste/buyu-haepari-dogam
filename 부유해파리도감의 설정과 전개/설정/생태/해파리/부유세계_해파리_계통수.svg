    .sp{fill:#4f565d;font-size:12.5px}
    .note{fill:#6a7178;font-size:12px}
    .title{fill:#20252a;font-weight:700;font-size:22px}
    .status{font-size:12px;font-weight:700}
  </style>
  <rect class="bg" width="1180" height="1040"/>
  <text x="24" y="34" class="title">부유해파리강과 부유해파리목의 자연분류</text>

