<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" font-family="'Noto Serif CJK KR','UnDotum','Malgun Gothic','맑은 고딕',sans-serif">
  <style>
    .bg{fill:#ffffff}
