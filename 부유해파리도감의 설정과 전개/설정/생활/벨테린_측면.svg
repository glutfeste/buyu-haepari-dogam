<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="원양 탐사선 벨테린의 측면과 내부 구획도">
  <style>
    text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
    .label{font-size:15px;font-weight:600;fill:#3d382f;}
    .small{font-size:12px;fill:#736a5b;}
    .guide{fill:none;stroke:#9d927f;stroke-width:1;stroke-dasharray:4 4;}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf6f7"/>
      <stop offset="1" stop-color="#d9e9ec"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f3e8"/>
      <stop offset="1" stop-color="#82cbb7"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a56f43"/>
      <stop offset="1" stop-color="#68432d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#756b5b" stroke-width="1.5"/>
    </marker>
    <clipPath id="hullclip">
      <path d="M190 385 Q225 348 300 338 L925 338 Q1000 343 1035 374 L995 475 Q950 520 835 534 L365 534 Q260 518 220 470 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="720" fill="#f5efe3"/>
  <rect x="42" y="90" width="1116" height="480" rx="8" fill="url(#sky)" stroke="#c9c0ae"/>
  <text x="70" y="52" font-size="27" font-weight="700" fill="#373229">벨테린 — 측면과 내부 구획</text>
  <text x="70" y="76" font-size="14" fill="#756c5e">코룬에서 인수한 24미터급 무장 원양 탐사선·밀폐 인양선</text>

  <!-- 임모타 잠수 전환 -->
  <g>
    <rect x="58" y="106" width="182" height="103" rx="6" fill="#f8f3e8" stroke="#9d927f"/>
    <text x="73" y="130" class="label">임모타 잠수 전환</text>
    <text x="73" y="153" class="small">양소 → 고압 용기 8개</text>
    <text x="73" y="174" class="small">기낭·발판 → 골조에 결박</text>
    <text x="73" y="195" class="small">증기 → 태엽·중앙 밀폐축</text>
  </g>

  <!-- 먼 쪽 네 기낭 -->
  <g opacity="0.58" stroke="#4c9785" stroke-width="1.5" fill="url(#bag)">
    <ellipse cx="370" cy="192" rx="118" ry="57"/>
    <ellipse cx="545" cy="178" rx="118" ry="57"/>
    <ellipse cx="720" cy="178" rx="118" ry="57"/>
    <ellipse cx="895" cy="192" rx="118" ry="57"/>
  </g>

  <!-- 가까운 쪽 네 기낭과 내부 양소 방 -->
  <g stroke="#397e70" stroke-width="2" fill="url(#bag)">
    <ellipse cx="350" cy="238" rx="120" ry="60"/>
    <ellipse cx="525" cy="224" rx="120" ry="60"/>
    <ellipse cx="700" cy="224" rx="120" ry="60"/>
    <ellipse cx="875" cy="238" rx="120" ry="60"/>
  </g>
  <g fill="none" stroke="#67aa99" stroke-width="1" opacity="0.9">
    <path d="M250 220H450M255 244H445M275 265H425M283 202V274M316 185V290M350 178V298M383 185V290M416 202V274"/>
    <path d="M425 206H625M430 230H620M450 251H600M458 188V260M491 171V276M525 164V284M558 171V276M591 188V260"/>
    <path d="M600 206H800M605 230H795M625 251H775M633 188V260M666 171V276M700 164V284M733 171V276M766 188V260"/>
    <path d="M775 220H975M780 244H970M800 265H950M808 202V274M841 185V290M875 178V298M908 185V290M941 202V274"/>
  </g>

  <!-- 현수 골조 -->
  <g stroke="#8a704b" stroke-width="4" fill="none">
    <path d="M290 276L320 352M405 286L430 348M465 278L500 346M585 282L600 344M640 282L700 344M760 282L800 347M825 288L900 348M940 276L970 360"/>
    <path d="M280 310H960" stroke="#b88b4e" stroke-width="6"/>
  </g>

  <!-- 선체 -->
  <path d="M190 385 Q225 348 300 338 L925 338 Q1000 343 1035 374 L995 475 Q950 520 835 534 L365 534 Q260 518 220 470 Z" fill="url(#hull)" stroke="#493226" stroke-width="4"/>
  <g clip-path="url(#hullclip)">
    <rect x="215" y="377" width="800" height="132" fill="#e9d3ad" opacity="0.93"/>
    <line x1="315" y1="365" x2="315" y2="520" stroke="#775541" stroke-width="4"/>
    <line x1="405" y1="354" x2="405" y2="529" stroke="#775541" stroke-width="4"/>
    <line x1="495" y1="347" x2="495" y2="533" stroke="#775541" stroke-width="4"/>
    <line x1="585" y1="344" x2="585" y2="535" stroke="#775541" stroke-width="4"/>
    <line x1="675" y1="344" x2="675" y2="535" stroke="#775541" stroke-width="4"/>
    <line x1="765" y1="344" x2="765" y2="534" stroke="#775541" stroke-width="4"/>
    <line x1="855" y1="346" x2="855" y2="530" stroke="#775541" stroke-width="4"/>
    <rect x="235" y="390" width="76" height="86" rx="3" fill="#d9ecdf" stroke="#6d8c78"/>
    <rect x="320" y="390" width="81" height="86" rx="3" fill="#f1dfbd" stroke="#9a7a4e"/>
    <rect x="410" y="390" width="81" height="86" rx="3" fill="#f1dfbd" stroke="#9a7a4e"/>
    <rect x="500" y="390" width="81" height="86" rx="3" fill="#f4e7c9" stroke="#9a7a4e"/>
    <rect x="590" y="390" width="81" height="86" rx="3" fill="#d7c8b3" stroke="#806e5a"/>
    <rect x="680" y="390" width="81" height="86" rx="3" fill="#e1d2bb" stroke="#806e5a"/>
    <rect x="770" y="390" width="81" height="86" rx="3" fill="#d7c8b3" stroke="#806e5a"/>
    <rect x="860" y="390" width="135" height="86" rx="3" fill="#c9d0ce" stroke="#677674"/>
    <rect x="355" y="485" width="474" height="35" rx="5" fill="#424746" stroke="#262b2a" stroke-width="2"/>
    <g fill="#d7b55e" stroke="#7c6326">
      <rect x="375" y="493" width="50" height="18" rx="3"/>
      <rect x="442" y="493" width="50" height="18" rx="3"/>
      <rect x="509" y="493" width="50" height="18" rx="3"/>
      <rect x="576" y="493" width="50" height="18" rx="3"/>
      <rect x="643" y="493" width="50" height="18" rx="3"/>
      <rect x="710" y="493" width="50" height="18" rx="3"/>
      <rect x="777" y="493" width="35" height="18" rx="3"/>
    </g>
  </g>

  <!-- 조타실, 포, 기관, 프로펠러 -->
  <path d="M535 338V300H690V338Z" fill="#d8c4a0" stroke="#5e4937" stroke-width="3"/>
  <rect x="555" y="310" width="32" height="19" fill="#bde4e5" stroke="#587f82"/>
  <rect x="598" y="310" width="32" height="19" fill="#bde4e5" stroke="#587f82"/>
  <rect x="641" y="310" width="32" height="19" fill="#bde4e5" stroke="#587f82"/>
  <circle cx="615" cy="296" r="10" fill="#8fd6c0" stroke="#356f65" stroke-width="2"/>
  <rect x="185" y="350" width="90" height="14" rx="4" fill="#424746" stroke="#202525"/>
  <circle cx="198" cy="357" r="18" fill="#696e6c" stroke="#2d3231" stroke-width="3"/>
  <path d="M170 357H125" stroke="#323736" stroke-width="8"/>
  <path d="M130 357L105 342M130 357L105 372" stroke="#323736" stroke-width="5"/>
  <g transform="translate(1050 402)" stroke="#4b5352" stroke-width="5" fill="none">
    <circle r="9" fill="#606967"/>
    <path d="M0 -10Q30 -50 17 -7Q58 0 17 7Q30 50 0 10Q-30 50 -17 7Q-58 0 -17 -7Q-30 -50 0 -10Z" fill="#7a8582" stroke="#4b5352" stroke-width="2"/>
  </g>
  <g transform="translate(1050 466)" stroke="#4b5352" stroke-width="5" fill="none">
    <circle r="9" fill="#606967"/>
    <path d="M0 -10Q30 -50 17 -7Q58 0 17 7Q30 50 0 10Q-30 50 -17 7Q-58 0 -17 -7Q-30 -50 0 -10Z" fill="#7a8582" stroke="#4b5352" stroke-width="2"/>
  </g>
  <circle cx="1005" cy="434" r="14" fill="#d6a84c" stroke="#6d5220" stroke-width="3"/>
  <path d="M995 434H1033" stroke="#6d5220" stroke-width="5"/>

  <!-- 구획 안 라벨 -->
  <text x="273" y="421" text-anchor="middle" class="label">관측실</text>
  <text x="273" y="442" text-anchor="middle" class="small">넬라 · 표본</text>
  <text x="405" y="420" text-anchor="middle" class="label">개인 선실</text>
  <text x="405" y="441" text-anchor="middle" class="small">6실</text>
  <text x="540" y="420" text-anchor="middle" class="label">공용실</text>
  <text x="540" y="441" text-anchor="middle" class="small">식탁 · 조리대</text>
  <text x="630" y="420" text-anchor="middle" class="label">암실</text>
  <text x="720" y="420" text-anchor="middle" class="label">탄약고</text>
  <text x="810" y="420" text-anchor="middle" class="label">공방</text>
  <text x="810" y="441" text-anchor="middle" class="small">요런 · 부품</text>
  <text x="925" y="420" text-anchor="middle" class="label">기관실</text>

  <!-- 외부 설명선 -->
  <path d="M820 145L1010 112" class="guide"/>
  <text x="1018" y="108" class="label">여덟 다실 양소 기낭</text>
  <text x="1018" y="127" class="small">기낭 하나당 독립 방 24개</text>
  <path d="M615 298L735 139" class="guide"/>
  <rect x="602" y="96" width="214" height="43" rx="4" fill="#edf6f7" stroke="#c9c0ae"/>
  <text x="614" y="115" class="label">조타실과 수정 받침</text>
  <text x="614" y="132" class="small">아멜리가 항법·조타·사격을 담당한다</text>
  <path d="M198 337L120 270" class="guide"/>
  <text x="64" y="245" class="label">60밀리미터 선회포</text>
  <text x="64" y="264" class="small">철갑탄·파열탄 32발</text>
  <path d="M1007 434L1110 330" class="guide"/>
  <text x="1015" y="300" class="label">좌우 독립 증기기관</text>
  <text x="1015" y="319" class="small">기관 하나로 평상 속력의 40%</text>
  <path d="M1005 451L1112 512" class="guide"/>
  <text x="955" y="545" class="label">중앙 밀폐축</text>
  <text x="955" y="564" class="small">12kg 방전함 2개 · 비상 추진</text>
  <path d="M675 535V546" class="guide"/>
  <text x="675" y="563" text-anchor="middle" class="small">일곱 횡격벽 · 여덟 기밀 구획</text>

  <!-- 치수선과 범례 -->
  <line x1="205" y1="600" x2="1025" y2="600" stroke="#756b5b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="205" y1="585" x2="205" y2="614" stroke="#756b5b"/>
  <line x1="1025" y1="585" x2="1025" y2="614" stroke="#756b5b"/>
  <text x="615" y="623" text-anchor="middle" class="label">선체 길이 24m · 최대 폭 6m · 정원 8명 · 항속 60일</text>

  <g transform="translate(74 655)">
    <rect x="0" y="-15" width="20" height="14" fill="#8bcdb9" stroke="#397e70"/>
    <text x="29" y="-3" class="small">다실 양소 기낭</text>
    <rect x="180" y="-15" width="20" height="14" fill="#e9d3ad" stroke="#775541"/>
    <text x="209" y="-3" class="small">생활·작업 구획</text>
    <rect x="360" y="-15" width="20" height="14" fill="#424746" stroke="#262b2a"/>
    <text x="389" y="-3" class="small">부상석 용골·국부 장갑</text>
    <rect x="600" y="-15" width="20" height="14" fill="#d6a84c" stroke="#6d5220"/>
    <text x="629" y="-3" class="small">중앙 밀폐축</text>
  </g>
</svg>
