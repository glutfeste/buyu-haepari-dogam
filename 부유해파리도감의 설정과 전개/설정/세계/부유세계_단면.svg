<text x="530" y="94" font-size="13" font-weight="600" fill="#3B342A">천장권</text>
<text x="530" y="107" font-size="11" fill="#7A7264">옅고 차가운 수소의 천장</text>

<line x1="510" y1="129" x2="526" y2="129" stroke="#A89C84" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="530" y="126" font-size="13" font-weight="600" fill="#3B342A">희박권 — 윗하늘</text>
<text x="530" y="139" font-size="11" fill="#7A7264">약한 방전이 끊이지 않는다</text>

<line x1="510" y1="223" x2="526" y2="223" stroke="#A89C84" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="530" y="220" font-size="13" font-weight="600" fill="#3B342A">호흡권 — 바다</text>
<text x="530" y="233" font-size="11" fill="#7A7264">숨 쉴 수 있는 층. 부초가 떠 있다</text>

<line x1="510" y1="331" x2="526" y2="331" stroke="#A89C84" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="530" y="328" font-size="13" font-weight="600" fill="#3B342A">질식권 — 아랫하늘</text>
<text x="530" y="341" font-size="11" fill="#7A7264">무겁고 유독한 가스층</text>

<line x1="510" y1="388" x2="526" y2="388" stroke="#A89C84" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="530" y="385" font-size="13" font-weight="600" fill="#3B342A">뇌전권</text>
<text x="530" y="398" font-size="11" fill="#7A7264">번개 치는 폭풍층</text>

<line x1="510" y1="431" x2="526" y2="431" stroke="#A89C84" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="530" y="428" font-size="13" font-weight="600" fill="#3B342A">금강권</text>
<text x="530" y="441" font-size="11" fill="#7A7264">다이아몬드 비가 내린다</text>

<line x1="510" y1="486" x2="526" y2="486" stroke="#A89C84" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="530" y="483" font-size="13" font-weight="600" fill="#3B342A">백열권</text>
<text x="530" y="496" font-size="11" fill="#7A7264">고온·고압의 심부. 부상석이 형성된다</text>

<line x1="510" y1="539" x2="526" y2="539" stroke="#A89C84" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="530" y="536" font-size="13" font-weight="600" fill="#3B342A">핵</text>
<text x="530" y="549" font-size="11" fill="#7A7264">금속 수소. 세계의 맨 밑바닥</text>

<text x="380" y="585" font-size="13" fill="#6B6357" text-anchor="middle">부상석이 깊은 곳에서 떠올라 대륙이 되고, 사람들은 그 위에서 산다</text>
