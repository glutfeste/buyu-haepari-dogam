<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- 한글 글꼴 대체: Pretendard → Noto Sans KR → Malgun Gothic → Apple SD Gothic Neo → sans-serif -->

  <defs>
    <linearGradient id="deepair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d9ad"/>
      <stop offset="1" stop-color="#bb904f"/>
    </linearGradient>
  </defs>

  <!-- 하늘 층 -->
  <rect x="0" y="0" width="960" height="185" fill="#f2f7fa"/>
  <rect x="0" y="185" width="960" height="235" fill="#ddeaf3"/>
  <rect x="0" y="420" width="960" height="140" fill="url(#deepair)"/>
  <text x="12" y="58" font-size="11" fill="#8aa2b2">희박권 — 윗하늘. 옅고 차가운 하늘</text>
  <text x="12" y="205" font-size="11" fill="#6b8aa0">호흡권 — 바다. 거주 고도</text>
  <text x="12" y="545" font-size="11" fill="#7a5c2e">질식권 — 아랫하늘. 무겁고 유독한 공기</text>

  <!-- 제목 -->
  <text x="270" y="40" font-size="20" font-weight="bold" fill="#3b3a33">아우렐리아 — 북서·남동 측면</text>
  <text x="270" y="60" font-size="12" fill="#6f6a55">높이는 과장했다 · 베스페라와 리토레아는 단면선 밖이다</text>
  <text x="270" y="78" font-size="11" fill="#7a93a5">아랫하늘에서 솟은 수증기가 찬 산에 눈으로 쌓이고, 녹아 강이 되어 대폭포로 돌아간다</text>
  <text x="70" y="88" font-size="13" font-weight="bold" fill="#5a6c7a">◀ 북서</text>
  <text x="850" y="88" font-size="13" font-weight="bold" fill="#5a6c7a">남동 ▶</text>

  <!-- 대륙 본체 (지표면 + 밑동) -->
  <path d="M 70,250 L 100,242 L 130,235 L 150,205 L 165,225 L 180,176 L 200,228 L 240,238 L 300,240 L 330,205 L 345,175 L 360,210 L 380,250 L 400,285 L 460,292 L 560,295 L 600,318 L 680,330 L 760,342 L 880,348 L 882,380 C 870,430 840,470 780,500 C 700,540 560,575 470,575 C 360,570 250,540 170,480 C 110,430 80,340 70,250 Z"
        fill="#efe7d3" stroke="#8a7f63" stroke-width="2.5"/>

  <!-- 만년설 -->
  <polygon points="142,219 150,205 158,219" fill="#ffffff" stroke="#cfd8de" stroke-width="0.8"/>
  <polygon points="172,194 180,176 188,194" fill="#ffffff" stroke="#cfd8de" stroke-width="0.8"/>
  <polygon points="337,191 345,175 353,191" fill="#ffffff" stroke="#cfd8de" stroke-width="0.8"/>
  <polygon points="324,212 330,205 338,214" fill="#ffffff" stroke="#cfd8de" stroke-width="0.8"/>

  <!-- 강 오렌투스 (지표를 따라 흘러내려 대폭포로) -->
  <path d="M 356,206 L 372,238 L 384,256 L 400,287 L 460,290 L 560,293 L 600,316 L 680,328 L 760,340 L 876,346"
        fill="none" stroke="#4a7fb5" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 876,346 C 896,380 902,420 904,470 C 905,490 904,505 902,518"
        fill="none" stroke="#4a7fb5" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
  <text x="560" y="285" font-size="12" font-weight="bold" fill="#33618f">오렌투스</text>
  <text x="908" y="430" font-size="12" fill="#33618f">대폭포</text>

  <!-- 부상석 밑동 -->
  <g stroke="#3f8f88" stroke-width="1.5">
    <polygon points="450,545 470,515 492,545 470,572" fill="#8fd6cd"/>
    <polygon points="508,552 524,530 540,552 524,570" fill="#a5dfd7"/>
    <polygon points="404,536 420,516 436,536 420,554" fill="#a5dfd7"/>
    <polygon points="556,548 568,532 580,548 568,562" fill="#b8e6e0"/>
  </g>
  <text x="600" y="555" font-size="12" fill="#2e6d66">부상석 — 부초를 떠받치는 밑동</text>

  <!-- 산맥·지대 라벨 -->
  <text x="96" y="168" font-size="11" fill="#41597e">설산 — 만년설이 물을 모은다</text>
  <line x1="152" y1="174" x2="151" y2="200" stroke="#41597e" stroke-width="0.8"/>
  <text x="296" y="140" font-size="11" fill="#6f6a55">헬름그라트 산맥 — 오렌투스의 발원</text>
  <line x1="346" y1="146" x2="345" y2="170" stroke="#6f6a55" stroke-width="0.8"/>

  <!-- 희박권에 걸친 봉우리의 수소 연소 (푸른 불꽃) -->
  <polygon points="342,173 345,163 348,173" fill="#a9d0f5" opacity="0.9"/>
  <polygon points="177,174 180,164 183,174" fill="#a9d0f5" opacity="0.9"/>
  <text x="430" y="112" font-size="10" fill="#5b8ac4">푸른 불꽃 — 희박권의 방전이 봉우리 위 수소를 태워 물을 만든다</text>
  <line x1="426" y1="108" x2="352" y2="166" stroke="#5b8ac4" stroke-width="0.6" stroke-dasharray="3 3"/>

  <!-- 권역 라벨 -->
  <text x="150" y="290" font-size="17" font-weight="bold" fill="#41597e" letter-spacing="2">스톨</text>
  <text x="110" y="310" font-size="10" fill="#41597e">가장 높은 고원 — 차고 항구가 드물다</text>
  <text x="450" y="335" font-size="17" font-weight="bold" fill="#7a4a3c" letter-spacing="2">글루트</text>
  <text x="585" y="360" font-size="13" font-weight="bold" fill="#6f6a55">오렌티아</text>
  <text x="700" y="385" font-size="17" font-weight="bold" fill="#2d5f7a" letter-spacing="1">아이스투아리아</text>
  <text x="712" y="403" font-size="10" fill="#2d5f7a">가장 낮은 바닷가 땅</text>

  <!-- 물 순환 화살표 (수증기 상승, 대륙 바깥) -->
  <path d="M 40,500 C 30,420 35,330 55,260 C 65,230 90,210 126,201" stroke="#9bb7c9" stroke-width="1.5" fill="none" stroke-dasharray="3 4"/>
  <polygon points="126,196 138,201 126,207" fill="#9bb7c9"/>
  <text x="8" y="490" font-size="9" fill="#7a93a5">수증기 상승</text>
</svg>
