name: Audit silver plate usage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-silver-plate-usage.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build contextual audit report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path('원고/본문')]
          extra = [
              Path('원고/집필 원칙.md'),
              Path('부유해파리도감의 설정과 전개/설정/장치/은침의.md'),
              Path('부유해파리도감의 설정과 전개/설정/구문/구문.md'),
          ]
          files = []
          for root in roots:
              files.extend(sorted(root.rglob('*.md')))
          files.extend(extra)

          needles = ('은침의', '은판')
          out = ['# 은판·은침의 운용 전역 감사', '']
          total = 0
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
              if not hits:
                  continue
              out.append(f'## {path.as_posix()}')
              out.append('')
              merged = []
              for i in hits:
                  a, b = max(0, i - 2), min(len(lines), i + 3)
                  if merged and a <= merged[-1][1]:
                      merged[-1] = (merged[-1][0], max(merged[-1][1], b))
                  else:
                      merged.append((a, b))
              for a, b in merged:
                  total += sum(1 for i in range(a, b) if any(n in lines[i] for n in needles))
                  out.append(f'### L{a+1}–L{b}')
                  out.append('```text')
                  for i in range(a, b):
                      marker = '>>' if any(n in lines[i] for n in needles) else '  '
                      out.append(f'{marker} {i+1:04d}: {lines[i]}')
                  out.append('```')
                  out.append('')
          out.insert(2, f'검색 적중 줄 수: {total}')
          out.insert(3, '')
          Path('은판 운용 감사.tmp.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm .github/workflows/audit-silver-plate-usage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m '작업: 은판 운용 감사 결과 생성'
          git push origin HEAD:main
