name: Fix jelly aerial workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jelly-aerial-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct checklist anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-jelly-aerial-kinetics.yml')
          text = path.read_text(encoding='utf-8')
          wrong = "old = '58. `[RULE:SCENE-PHYSICAL-CONTINUITY]` 대화 중에도 배의 기울기, 종이의 위치, 남은 음식, 상처의 통증, 기관 진동처럼 앞선 물리 상태가 계속 작용해야 한다. 2층의 몸과 소품 묘사는 장식이 아니라 **장면의 연속성을 운반하는 정보**다.'"
          right = "old = '58. `[RULE:SCENE-PHYSICAL-CONTINUITY]` 대화 중에도 몸·배·생물·물건이 계속 움직이는가?'"
          if text.count(wrong) != 1:
              raise RuntimeError(f'expected one bad anchor, found {text.count(wrong)}')
          path.write_text(text.replace(wrong, right, 1), encoding='utf-8')
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-jelly-aerial-workflow.yml
          git add --all
          git commit -m '작업: 부유 해파리 개고 체크 항목 연결 수정'
          git push origin HEAD:main
