name: Fix jelly aerial workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jelly-aerial-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct checklist anchor and validation count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-jelly-aerial-kinetics.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "old = '58. `[RULE:SCENE-PHYSICAL-CONTINUITY]` 대화 중에도 배의 기울기, 종이의 위치, 남은 음식, 상처의 통증, 기관 진동처럼 앞선 물리 상태가 계속 작용해야 한다. 2층의 몸과 소품 묘사는 장식이 아니라 **장면의 연속성을 운반하는 정보**다.'",
                  "old = '58. `[RULE:SCENE-PHYSICAL-CONTINUITY]` 대화 중에도 몸·배·생물·물건이 계속 움직이는가?'",
                  'checklist anchor',
              ),
              (
                  "if rule_text.count('RULE:JELLY-AERIAL-KINETICS') != 3:",
                  "if rule_text.count('RULE:JELLY-AERIAL-KINETICS') != 2:",
                  'rule count',
              ),
              (
                  "raise RuntimeError('aerial kinetics rule was not synchronized in three locations')",
                  "raise RuntimeError('aerial kinetics rule and checklist were not synchronized')",
                  'validation message',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-jelly-aerial-workflow.yml
          git add --all
          git commit -m '작업: 부유 해파리 개고 체크와 검증 조건 수정'
          git push origin HEAD:main
