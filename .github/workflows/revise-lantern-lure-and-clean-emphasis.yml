name: Clean manuscript emphasis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revise-lantern-lure-and-clean-emphasis.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove bold and italic markup from manuscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              (re.compile(r'\*\*\*([^*\n]+?)\*\*\*'), r'\1'),
              (re.compile(r'\*\*([^*\n]+?)\*\*'), r'\1'),
              (re.compile(r'(?<!\*)\*([^*\n]+?)\*(?!\*)'), r'\1'),
          ]

          files = sorted(Path('원고/본문').glob('*.md'))
          for path in files:
              text = path.read_text(encoding='utf-8')
              for pattern, replacement in patterns:
                  previous = None
                  while previous != text:
                      previous = text
                      text = pattern.sub(replacement, text)
              path.write_text(text, encoding='utf-8')

          corpus = '\n'.join(path.read_text(encoding='utf-8') for path in files)
          if '**' in corpus:
              raise RuntimeError('bold markup remains in manuscript')
          if re.search(r'(?<!\*)\*[^*\n]+?\*(?!\*)', corpus):
              raise RuntimeError('italic markup remains in manuscript')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/revise-lantern-lure-and-clean-emphasis.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m '교정(본문 전체): 마크다운 굵게·기울임 강조 제거'
          git push origin HEAD:main
