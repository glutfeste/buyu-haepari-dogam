name: Add acularium agent guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-acullarium-agent-guard.yml'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add required canon pointer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          text = path.read_text(encoding='utf-8')
          old = '- 설정을 수정할 때는 수정 대상의 현재 문서와 직접 이어지는 문서를 확인한다. 세계 전체의 맥락이 필요할 때만 설정 바이블을 추가로 읽는다.'
          new = old + '\n- 연금술·은침의·은판의 시전 장면을 쓰거나 고칠 때는 `원고/집필 원칙.md`의 `RULE:MEDIA-ACULARIUM-CLOSED-LOADOUT`과 `부유해파리도감의 설정과 전개/설정/장치/은침의.md`를 확인한다. 은판 운용을 카드·주문책·공구함의 인상으로 추정하지 않는다.'
          if text.count(old) != 1:
              raise RuntimeError(f'expected 1 match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/add-acullarium-agent-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit \
            -m '지침: 은침의 운용 정본 확인 절차 추가' \
            -m 'Rules: RULE:MEDIA-ACULARIUM-CLOSED-LOADOUT, RULE:PROCESS-REPEATED-FEEDBACK-TO-RULE' \
            -m 'Reason: 다른 작업 에이전트가 은판을 시전 때마다 고르는 카드나 공구처럼 추정하는 오류가 반복됐다.' \
            -m 'Changes: 연금술 시전 장면을 다룰 때 집필 원칙의 전용 RULE과 은침의 정본을 반드시 확인하도록 AGENTS.md에 경로를 연결했다.'
          git push origin HEAD:main
