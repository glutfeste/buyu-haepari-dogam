name: Run jelly aerial revision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-jelly-aerial-revision.yml'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute the reviewed revision script
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/apply-jelly-aerial-kinetics.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate and commit"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise RuntimeError('could not isolate revision script')

          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)

          replacements = [
              (
                  "old = '58. `[RULE:SCENE-PHYSICAL-CONTINUITY]` 대화 중에도 배의 기울기, 종이의 위치, 남은 음식, 상처의 통증, 기관 진동처럼 앞선 물리 상태가 계속 작용해야 한다. 2층의 몸과 소품 묘사는 장식이 아니라 **장면의 연속성을 운반하는 정보**다.'",
                  "old = '58. `[RULE:SCENE-PHYSICAL-CONTINUITY]` 대화 중에도 몸·배·생물·물건이 계속 움직이는가?'",
              ),
              (
                  "if rule_text.count('RULE:JELLY-AERIAL-KINETICS') != 3:",
                  "if rule_text.count('RULE:JELLY-AERIAL-KINETICS') != 2:",
              ),
              (
                  "raise RuntimeError('aerial kinetics rule was not synchronized in three locations')",
                  "raise RuntimeError('aerial kinetics rule and checklist were not synchronized')",
              ),
          ]
          for old, new in replacements:
              count = script.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one script patch target, found {count}: {old[:60]}')
              script = script.replace(old, new, 1)

          exec(compile(script, 'jelly-aerial-revision', 'exec'), {})
          PYCODE

      - name: Validate, clean temporary files, and commit
        shell: bash
        run: |
          git diff --check
          rm -f \
            '.github/workflows/run-jelly-aerial-revision.yml' \
            '.github/workflows/apply-jelly-aerial-kinetics.yml' \
            '.github/workflows/fix-jelly-aerial-workflow.yml' \
            '부유 해파리 공중 운동 감사.tmp.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit \
            -m '개고(2·3·4·5·9·14·16·21·22·23화): 부유 해파리의 공중 운동 복원' \
            -m 'Rules: RULE:JELLY-AERIAL-KINETICS, RULE:SCENE-ECOLOGY-IN-ACTION, RULE:SCENE-PHYSICAL-CONTINUITY, RULE:PROCESS-GLOBAL-PATTERN-AUDIT' \
            -m 'Reason: 보글이와 여러 부유 해파리가 공중을 나는 생물보다 장면 속 한 지점에 놓인 소품처럼 묘사되는 구간이 반복됐다.' \
            -m 'Changes: 고도·선회·관성·기류·촉수의 흐름과 자세 보정을 장면별로 복원하고, 23화의 수중 유리병 묘사를 공중 생물용 보호틀로 교체했으며 집필 원칙과 체크를 동기화했다.'
          git push origin HEAD:main
