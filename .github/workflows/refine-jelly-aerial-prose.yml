name: Refine jelly aerial prose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-jelly-aerial-prose.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine continuity and wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('원고/본문/04 불러도 답하지 않음.md')
          replace_once(
              p,
              '넬라가 손바닥으로 길을 막자 침낭 머리맡으로 낮게 돌아 날아왔고,',
              '넬라가 손바닥으로 길을 막자 침낭 머리맡으로 낮은 호를 그려 날아왔고,',
              'chapter 4 natural flight wording',
          )

          p = Path('원고/본문/23 손바닥 위의 항로.md')
          replace_once(
              p,
              '넬라는 표본병 상자를 안쪽 칸막이 아래로 밀어 넣은 뒤 선반 아래에 묶어 둔 보글이의 둥근 보호틀과 고정끈까지 확인했다.',
              '넬라는 표본병 상자를 안쪽 칸막이 아래로 밀어 넣은 뒤 선반 아래에 매단 보글이의 천 자리와 네 모서리 매듭까지 확인했다.',
              'chapter 23 established resting place',
          )
          replace_once(
              p,
              '안쪽 선반 아래의 둥근 보호틀도 고정끈 끝에서 크게 기울었다. 둘레의 완충천 한쪽이 빠져나온 것을 본 넬라는 무릎을 바닥에 대고 천을 다시 틈에 밀어 넣었다. 틀 안에서 옆으로 쏠렸던 보글이는 갓을 두 번 오므려 몸을 세우고, 촉수를 기울어진 반대쪽으로 펼쳐 가운데 높이를 되찾았다.',
              '안쪽 선반 아래의 천 자리도 한쪽으로 크게 쏠렸다. 모서리 매듭 하나가 느슨해져 천이 처지는 것을 본 넬라는 무릎을 바닥에 대고 줄을 다시 당겨 묶었다. 천 가장자리로 밀렸던 보글이는 갓을 두 번 오므려 몸을 떼고, 촉수를 기울어진 반대쪽으로 펼쳐 선반 아래의 가운데 허공을 되찾았다.',
              'chapter 23 aerial shelter continuity',
          )
          PY

      - name: Validate, clean, and commit
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/refine-jelly-aerial-prose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit \
            -m '개고(4·23화): 보글이 비행과 잠자리 연속성 정리' \
            -m 'Rules: RULE:JELLY-AERIAL-KINETICS, RULE:SCENE-PHYSICAL-CONTINUITY' \
            -m 'Reason: 23화의 새 보호 장비가 앞선 장면 없이 나타났고 4화의 한 동작 표현이 어색했다.' \
            -m 'Changes: 4화의 선회 문장을 다듬고, 23화에서는 4화부터 쓰던 천 자리를 난기류 피난처로 이어 보글이가 다시 허공을 되찾게 했다.'
          git push origin HEAD:main
