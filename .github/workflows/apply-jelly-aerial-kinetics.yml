name: Apply jelly aerial kinetics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-jelly-aerial-kinetics.yml'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revise aerial movement prose and rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2화: 야생 거품해파리 군집을 정적인 표본 배열이 아니라 공중에서 먹이를 훑는 생물로 묘사한다.
          p = Path('원고/본문/02 거품형 기낭 해파리 — 임시 표제.md')
          replace_once(
              p,
              '줄기망이 갈라지며 안쪽이 드러난 순간, 그늘 아래의 투명한 생물 몇 마리가 한꺼번에 햇빛을 받았다. 처음 눈에 걸린 것은 몸 안의 기체 공간이었다. 넬라가 대학에서 해부한 부유 해파리 가운데에는 하나의 큰 기낭을 가진 종도, 몇 개의 방으로 나뉜 종도 있었지만 저 개체들의 막 안쪽은 셀 수 없을 만큼 많은 작은 방으로 촘촘하게 나뉘어 있었고, 몸이 돌아갈 때마다 방 사이의 얇은 격막에서 빛이 잘게 갈라졌다.',
              '줄기망이 갈라지며 안쪽이 드러난 순간, 그늘 아래에서 줄기 사이를 오가던 투명한 생물 몇 마리가 한꺼번에 햇빛을 받았다. 한 마리는 몸을 짧게 오므려 위쪽 그늘로 비껴갔고, 다른 둘은 가는 촉수를 뒤로 흘린 채 같은 높이를 돌았다. 처음 눈에 걸린 것은 몸 안의 기체 공간이었다. 넬라가 대학에서 해부한 부유 해파리 가운데에는 하나의 큰 기낭을 가진 종도, 몇 개의 방으로 나뉜 종도 있었지만 저 개체들의 막 안쪽은 셀 수 없을 만큼 많은 작은 방으로 촘촘하게 나뉘어 있었고, 몸이 방향을 틀 때마다 방 사이의 얇은 격막에서 빛이 잘게 갈라졌다.',
              'chapter 2 first aerial reveal',
          )
          replace_once(
              p,
              '죽은 줄기들이 겹친 그늘 아래에는 조금 전 망원경으로 본 투명한 해파리들이 모여 있었다. 한 마리는 물러진 기낭초 조직을 떼어 입 쪽으로 가져갔고, 다른 한 마리는 균사 사이에서 기어 나온 벌레를 촉수로 낚아챘다. 넬라는 먹이 칸에 `기낭초 조직`, `소형 벌레`를 각각 적었다.',
              '죽은 줄기들이 겹친 그늘 아래에서는 조금 전 망원경으로 본 투명한 해파리들이 줄기 사이로 낮은 원을 그리며 먹이를 훑고 있었다. 한 마리는 몸을 한 번 수축해 물러진 기낭초 가까이로 붙은 뒤 조직을 떼어 입 쪽으로 가져갔고, 다른 한 마리는 균사 사이에서 기어 나온 벌레를 촉수로 낚아챈 뒤 몸을 반 바퀴 돌려 줄기에서 물러났다. 넬라는 먹이 칸에 `기낭초 조직`, `소형 벌레`를 각각 적었다.',
              'chapter 2 feeding flight',
          )
          replace_once(
              p,
              '갑판원이 두 걸음 옮기는 동안 작은 해파리는 그를 따라보다가 넬라 쪽으로 몸을 돌렸다. 넬라는 이 관찰을 행동 기록 칸에 따로 적었다.',
              '갑판원이 두 걸음 옮기는 동안 작은 해파리는 렌즈눈만 그를 따라 돌리다가, 넬라가 펜을 움직이자 몸을 비스듬히 세우고 짧은 호를 그려 그녀 쪽으로 방향을 바꿨다. 넬라는 이 관찰을 행동 기록 칸에 따로 적었다.',
              'chapter 2 juvenile turn',
          )

          # 3화: 보글이 합류 장면에 관성·고도·바람·촉수의 후행을 넣는다.
          p = Path('원고/본문/03 죽어 가는 섬.md')
          replace_once(
              p,
              '작은 해파리는 그 사이 한 번 박동해 가까이 왔다. 넬라가 한 발 물러서자 둥근 몸도 한 박자 늦게 따라붙었고, 두 걸음을 더 옮겨도 비슷한 간격을 유지했다. 렌즈눈 두 개가 넬라의 얼굴을 향했다.',
              '작은 해파리는 몸을 한 번 오므려 가까이 왔다. 넬라가 한 발 물러서자 가는 촉수를 뒤로 흘리며 그 자리를 조금 지나쳤다가, 둥근 몸을 비스듬히 돌려 한 박자 늦게 따라붙었다. 두 걸음을 더 옮겨도 작은 호를 그리며 비슷한 간격을 되찾았고, 렌즈눈 두 개는 계속 넬라의 얼굴을 향했다.',
              'chapter 3 approach inertia',
          )
          replace_once(
              p,
              '배 쪽에서 철수 종이 울렸고 선장은 군락 안쪽으로 더 들어가지 말라고 외쳤다. 갑판원이 널빤지 쪽으로 방향을 바꾸자 넬라도 뒤따랐는데, 열 걸음쯤 갔을 때 돌아보니 작은 해파리가 여전히 같은 간격으로 따라오고 있었다. 넬라가 걸음을 재촉하면 박동이 빨라졌고 멈추면 둥근 몸도 자리를 지켰다.',
              '배 쪽에서 철수 종이 울렸고 선장은 군락 안쪽으로 더 들어가지 말라고 외쳤다. 갑판원이 널빤지 쪽으로 방향을 바꾸자 넬라도 뒤따랐는데, 열 걸음쯤 갔을 때 돌아보니 작은 해파리가 여전히 같은 간격으로 따라오고 있었다. 넬라가 걸음을 재촉하면 몸의 수축이 빨라지고 촉수는 뒤로 길게 흘렀으며, 넬라가 멈추면 반 뼘쯤 더 나아갔다가 위아래로 작게 흔들리며 자리를 맞췄다.',
              'chapter 3 pursuit rhythm',
          )
          replace_once(
              p,
              '렌즈눈은 그대로 넬라를 향했다. 바로 그때 뒤쪽 줄기망이 쩌어억 갈라지며 군락 바닥이 흔들렸고, 작은 해파리는 몸을 급히 수축해 넬라 가까이 붙었다. 반사적으로 뻗던 손은 장갑 끝이 보이자 속도를 늦췄고, 넬라는 손바닥을 낮게 펴 보인 채 무너지는 줄기망부터 확인했다.',
              '렌즈눈은 그대로 넬라를 향했다. 바로 그때 뒤쪽 줄기망이 쩌어억 갈라지며 군락 바닥이 흔들렸고, 작은 해파리는 몸을 급히 수축해 바닥에서 한 뼘 솟은 뒤 넬라의 팔 안쪽으로 파고들었다. 반사적으로 뻗던 손은 장갑 끝이 보이자 속도를 늦췄고, 넬라는 손바닥을 낮게 펴 보인 채 무너지는 줄기망부터 확인했다.',
              'chapter 3 alarm movement',
          )
          replace_once(
              p,
              '널빤지 앞까지 따라온 작은 해파리는 넬라가 성체들이 남아 있는 쪽을 몇 번 가리켜도 그녀 곁에서 떠 있었다. 갑판원은 표본 가방에서 전날 남겨 둔 떼우산해파리 조직 조각을 꺼내며 먹이 반응부터 분리해 보자고 제안했다.',
              '널빤지 앞까지 따라온 작은 해파리는 넬라가 성체들이 남아 있는 쪽을 몇 번 가리켜도, 널빤지 사이로 드나드는 옆바람에 조금씩 밀리면서 짧은 수축으로 넬라의 어깨 높이를 되찾았다. 갑판원은 표본 가방에서 전날 남겨 둔 떼우산해파리 조직 조각을 꺼내며 먹이 반응부터 분리해 보자고 제안했다.',
              'chapter 3 crosswind hover',
          )
          replace_once(
              p,
              '작은 해파리는 먹이 조각을 촉수에 감은 채 다시 넬라 쪽으로 오고 있었다. 그녀 앞까지 도착하고 나서야 조각을 놓쳤고, 먹이는 아래 하늘로 떨어졌지만 두 렌즈눈은 계속 넬라를 향했다.',
              '작은 해파리는 먹이 조각을 촉수에 감은 채, 그 무게에 평소보다 낮아진 몸으로 다시 넬라 쪽을 향해 오르고 있었다. 몸을 오므릴 때마다 촉수에 감긴 조각이 뒤로 흔들렸고, 넬라 앞에서 어깨 높이를 되찾고 나서야 조각을 놓쳤다. 먹이는 아래 하늘로 떨어졌지만 두 렌즈눈은 계속 넬라를 향했다.',
              'chapter 3 carrying food',
          )
          replace_once(
              p,
              '계류줄이 풀리고 상선이 무너지는 군락에서 천천히 멀어졌는데도 작은 해파리는 선체 옆을 따라 박동하며 난간 높이까지 올라왔다. 넬라가 가까이 가려 하자 선장은 갑판 안쪽을 가리켰다. “거기서 해. 사람 하나 떨어지면 해파리보다 비싼 사고다.”',
              '계류줄이 풀리고 상선이 무너지는 군락에서 천천히 멀어졌는데도 작은 해파리는 선체가 만든 옆바람에 몇 번 밀리면서 몸을 틀어 되돌아왔고, 짧은 박동을 이어 난간 높이까지 올라왔다. 넬라가 가까이 가려 하자 선장은 갑판 안쪽을 가리켰다. “거기서 해. 사람 하나 떨어지면 해파리보다 비싼 사고다.”',
              'chapter 3 follow ship',
          )
          replace_once(
              p,
              '넬라는 난간에서 두 걸음 떨어진 곳을 기준으로 삼고 오른쪽과 왼쪽으로 천천히 움직였다. 작은 해파리는 방향을 바꿔 계속 따라왔고, 넬라가 화물 상자 뒤에 몸을 숨기자 갑판 위 사람들을 하나씩 훑다가 세 번째 선원 뒤에서 그녀가 얼굴을 내미는 순간 곧바로 접근했다.',
              '넬라는 난간에서 두 걸음 떨어진 곳을 기준으로 삼고 오른쪽과 왼쪽으로 천천히 움직였다. 작은 해파리는 넬라가 움직일 때마다 몸을 비스듬히 기울여 작은 호로 방향을 바꿨고, 촉수는 반 박자 늦게 휘어졌다. 넬라가 화물 상자 뒤에 몸을 숨기자 갑판 위 사람들을 하나씩 훑다가 세 번째 선원 뒤에서 그녀가 얼굴을 내미는 순간 곧바로 접근했다.',
              'chapter 3 tracking turns',
          )
          replace_once(
              p,
              '현재 갑판에서 장갑의 김이 사라졌다. 넬라는 바삭하게 마른 점액을 털어냈고, 외투를 입은 갑판원은 화물 상자 옆에 섰다. 작은 해파리는 외투 앞에서 촉수를 짧게 움직이다가 상자 뒤를 돌아 넬라를 찾았으며, 두 번째로 외투만 상자 위에 걸어 두자 천 가까이에 잠깐 머문 뒤 갑판을 훑었다. 넬라가 다시 외투를 입고 선원 둘 사이에 섞였을 때에는 거의 곧장 그녀에게 접근했다.',
              '현재 갑판에서 장갑의 김이 사라졌다. 넬라는 바삭하게 마른 점액을 털어냈고, 외투를 입은 갑판원은 화물 상자 옆에 섰다. 작은 해파리는 외투 앞에서 촉수를 짧게 움직이다가 몸을 기울여 상자 모서리를 돌아 넬라를 찾았으며, 두 번째로 외투만 상자 위에 걸어 두자 천 둘레를 한 바퀴 돈 뒤 고도를 조금 올려 갑판을 훑었다. 넬라가 다시 외투를 입고 선원 둘 사이에 섞였을 때에는 몸을 한 번 세게 오므려 거의 곧장 그녀에게 접근했다.',
              'chapter 3 coat test flight',
          )
          replace_once(
              p,
              '수첩 맨 위에는 여전히 **거품형 기낭 해파리**라는 임시 표제가 있었다. 넬라가 렌즈눈 위치를 그리는 동안 작은 해파리가 종이 위로 내려와 그림을 가렸고, 종이를 오른쪽으로 옮기면 몸도 오른쪽으로, 왼쪽으로 옮기면 다시 그쪽으로 따라왔다. 이번에는 종이 대신 펜촉만 천천히 움직여 보자 두 눈이 정확히 끝을 좇았다.',
              '수첩 맨 위에는 여전히 **거품형 기낭 해파리**라는 임시 표제가 있었다. 넬라가 렌즈눈 위치를 그리는 동안 작은 해파리가 종이 위 한 뼘까지 내려와 그림을 가렸고, 종이를 오른쪽으로 옮기면 몸을 기울여 옆으로 미끄러졌으며 왼쪽으로 옮기면 촉수를 뒤늦게 휘며 다시 그쪽으로 돌아왔다. 이번에는 종이 대신 펜촉만 천천히 움직여 보자 두 눈이 정확히 끝을 좇았다.',
              'chapter 3 paper tracking',
          )
          replace_once(
              p,
              '작은 해파리는 한동안 군락 쪽을 향해 떠 있다가 넬라가 옆에 서자 몸을 돌려 그녀에게 왔다. 넬라는 수첩을 꺼내려던 손을 가방 입구에서 멈추고 그대로 두었다. 상처 길이와 박동 간격은 잠시 뒤에도 잴 수 있었으므로, 지금은 새로 승선한 개체가 어느 높이에 머물고 무엇을 바라보는지 눈으로 따라가는 편이 먼저였다.',
              '작은 해파리는 한동안 군락 쪽을 향한 채 선체가 속도를 얻으며 생긴 바람에 조금씩 뒤로 밀렸지만, 넬라가 옆에 서자 몸을 두 번 오므려 그녀의 어깨 높이까지 올라왔다. 넬라는 수첩을 꺼내려던 손을 가방 입구에서 멈추고 그대로 두었다. 상처 길이와 박동 간격은 잠시 뒤에도 잴 수 있었으므로, 지금은 새로 승선한 개체가 어느 높이에 머물고 무엇을 바라보는지 눈으로 따라가는 편이 먼저였다.',
              'chapter 3 departure hover',
          )

          # 4화: 보글이가 선내의 수직 공간과 바람을 실제로 쓰게 한다.
          p = Path('원고/본문/04 불러도 답하지 않음.md')
          replace_once(
