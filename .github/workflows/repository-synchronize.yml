name: repository-synchronize

on:
  push:
    branches:
      - agent/full-discussion-integration-20260815
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-discussion-integration-20260815
          fetch-depth: 0

      - name: Apply final integration patch
        shell: bash
        run: |
          shopt -s nullglob
          parts=(.integration-final.patch.gz.b64.part*)
          if (( ${#parts[@]} == 0 )); then
            echo "No final integration payload"
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/final-integration.patch
          git apply --check /tmp/final-integration.patch
          git apply /tmp/final-integration.patch
          rm -f "${parts[@]}"

      - name: Validate exact final files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              'scripts/git-preflight.ps1': 'd3ec6551f91ec5f3f2cbfd29af3b7ae711eaedfbd4ce4c2d083c1b4cbef9c453',
              'scripts/restore-git-metadata.ps1': '35c3e30c5040b78a2a5c1746bc913e2fa99365e366f3d8aa7a0a423528744bdc',
              '투고 작품기획서.md': '72edae1b4edce4a5d229a885313a2523583adc72f18e8dcf187198e2798165da',
              '부유해파리도감의 설정과 전개/설정/부유해파리도감 설정 바이블.md': '18859b3bea929c42e3e85c9dbaab376d94ac69a9cc18d5763f8b3f4bb143cc28',
              '부유해파리도감의 설정과 전개/설정/인물/일행/넬라 베린디스.md': '502ef8990ca7730c8734ecf3e20e6b626230a97cd4b1cfc9145d25b8c1355c9f',
              '부유해파리도감의 설정과 전개/설정/인물/일행/마량.md': 'a14a0fa2392115f8f1d022a6878bdeaeb51774bece2916295d9f141c7ead6350',
              '부유해파리도감의 설정과 전개/설정/생태/수문비버.md': '2a2dcf1a6e9b0a918942a0faf2801acd5cbcd010bb138c4c92906553b760a559',
              '부유해파리도감의 설정과 전개/이야기/에피소드/27 콘라트의 몰락.md': '2a1744406c82520692f99f377e8e04cd176f9f4272dc37d8b3b1562c3db7c269',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'hash mismatch: {name}: {actual} != {digest}')
          print(f'validated {len(expected)} exact files')
          PY

      - name: Commit final integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No final integration changes"
            exit 0
          fi
          git commit -m "전역 설정 문서와 Git 사전검사를 마무리하다"
          git push origin HEAD:agent/full-discussion-integration-20260815
