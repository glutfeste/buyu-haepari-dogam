name: Apply acularium loadout rule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-acullarium-loadout-rule.yml'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canon and manuscript revisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1화: 일상 시전에서 은침의를 열고 판 묶음을 고르는 동작 제거
          p = Path('원고/본문/01 해파리 당직.md')
          replace_once(
              p,
              '넬라는 놋쇠 은침의를 열어 평소 쓰던 해파리 사역용 은판 묶음을 골랐다. 가장자리 한 개체의 몸 위치와 움직임을 대상에 결속하고 익숙한 배열을 읽어 신경망에 짧은 하강 신호를 기입했다.',
              '넬라는 놋쇠 은침의에 장착된 해파리 사역 배열을 읽었다. 가장자리 한 개체의 몸 위치와 움직임을 대상에 결속하고 신경망에 짧은 하강 신호를 기입했다.',
              'chapter 1 closed acularium use',
          )

          # 3화: 닫힌 은침의에 장착된 배열을 그대로 운용하도록 수정
          p = Path('원고/본문/03 죽어 가는 섬.md')
          replace_once(
              p,
              '갑판원은 넬라의 외투를 받아 입으려다가 군락 점액이 묻은 장갑이 축축하게 손에 붙는 것을 보고 얼굴을 찌푸렸다. 넬라는 그 장갑을 화물 상자 위에 놓고 은침의를 열었다. 겹친 구름 세 개가 눌린 놋쇠 뚜껑에도 갈색 점액이 말라붙어 있었고, 첫 마디에서 걸리던 경첩은 엄지로 밀자 딱 소리를 내며 열렸다.\n\n익숙한 배열을 새긴 은판을 골라 장갑에 대상 결속을 정하고 배열을 읽자 축축한 가죽에서 가느다란 김이 올라왔다.',
              '갑판원은 넬라의 외투를 받아 입으려다가 군락 점액이 묻은 장갑이 축축하게 손에 붙는 것을 보고 얼굴을 찌푸렸다. 넬라는 그 장갑을 화물 상자 위에 놓았다. 겹친 구름 세 개가 눌린 놋쇠 은침의의 뚜껑에도 갈색 점액이 말라붙어 있었다.\n\n은침의에 장착해 둔 건조 배열에 장갑만 대상 결속해 실행하자 축축한 가죽에서 가느다란 김이 올라왔다.',
              'chapter 3 closed acularium use',
          )
          replace_once(
              p,
              '현재 갑판에서 장갑의 김이 사라졌다. 넬라는 바삭하게 마른 점액을 털어낸 뒤 은판을 제자리로 넣었고, 외투를 입은 갑판원은 화물 상자 옆에 섰다.',
              '현재 갑판에서 장갑의 김이 사라졌다. 넬라는 바삭하게 마른 점액을 털어냈고, 외투를 입은 갑판원은 화물 상자 옆에 섰다.',
              'chapter 3 no plate reinsertion',
          )

          # 5화: 전투 중 노출된 은판을 직접 조작하는 동작 전체 제거
          p = Path('원고/본문/05 등불을 따라가지 말 것.md')
          replace_once(
              p,
              '초롱해파리의 몸 전체를 한꺼번에 살필 여유는 없었다. 돛대를 감은 굵은 촉수는 선체가 기울 때마다 나무를 죄어 팽팽해졌다가 잠깐 힘이 빠졌고, 안개 속 노란 발광기가 밝아질 때에는 반투명한 조직 안쪽으로 미세한 떨림이 번지는 순간이 몇 번씩 드러났다. 넬라는 그 수축 순서를 따라 은판의 호출을 골랐지만, 첫 시도에서 연동된 신호 한 갈래를 잘못 골라 머리 안쪽이 둔하게 울렸고 늦추려던 촉수와 나란히 있던 두 가닥까지 동시에 당겨졌다.',
              '초롱해파리의 몸 전체를 한꺼번에 살필 여유는 없었다. 돛대를 감은 굵은 촉수는 선체가 기울 때마다 나무를 죄어 팽팽해졌다가 잠깐 힘이 빠졌고, 안개 속 노란 발광기가 밝아질 때에는 반투명한 조직 안쪽으로 미세한 떨림이 번지는 순간이 몇 번씩 드러났다. 넬라는 그 수축 순서를 해파리 사역 배열에 결속했지만, 첫 시도에서 서로 이어진 세 촉수의 신호 경계를 잘못 잡아 머리 안쪽이 둔하게 울렸고 늦추려던 촉수와 나란히 있던 두 가닥까지 동시에 당겨졌다.',
              'chapter 5 target binding failure',
          )
          replace_once(
              p,
              '손을 떼고 세 촉수만 다시 보자 수축 순서를 구분할 수 있었다. 바깥쪽 촉수가 당기기 직전에 떨림이 먼저 지나갔고, 그 뒤 안쪽 둘이 반 박자씩 늦게 수축했으며 힘이 풀릴 때에도 비슷한 순서가 되풀이됐다. 다음 수축이 시작되기 직전 은선을 눌러 첫 가닥의 신호를 늦추자 돛대를 조이던 힘이 눈에 띄게 줄었다.',
              '결속을 끊고 세 촉수만 다시 보자 수축 순서를 구분할 수 있었다. 바깥쪽 촉수가 당기기 직전에 떨림이 먼저 지나갔고, 그 뒤 안쪽 둘이 반 박자씩 늦게 수축했으며 힘이 풀릴 때에도 비슷한 순서가 되풀이됐다. 다음 수축이 시작되기 직전 첫 가닥에 결속한 신호를 늦추자 돛대를 조이던 힘이 눈에 띄게 줄었다.',
              'chapter 5 no exposed silver line',
          )
          replace_once(
              p,
              '세 번째 촉수의 연동 신호까지 구분할 무렵에는 은판의 가는 선이 겹쳐 보이기 시작했고 시야 가장자리도 흐려졌지만, 촉수의 수축 순서는 이제 눈으로 따라갈 수 있었다.',
              '세 번째 촉수의 연동 신호까지 구분할 무렵에는 배열의 호출 순서가 머릿속에서 겹치기 시작했고 시야 가장자리도 흐려졌지만, 촉수의 수축 순서는 이제 눈으로 따라갈 수 있었다.',
              'chapter 5 cognitive overload',
          )
          replace_once(
              p,
              '은판 하나가 넬라 손에서 빠졌다.\n\n보글이가 먼저 내려가 촉수 끝으로 판 모서리를 감았고, 넬라가 몸을 숙여 은판을 낚아채 은침의에 밀어 넣는 순간 바로 옆으로 다른 촉수가 내리꽂혔다.',
              '젖은 은침의가 넬라 손에서 빠졌다.\n\n보글이가 먼저 내려가 촉수 끝으로 놋쇠 몸체를 감았고, 넬라가 몸을 숙여 은침의를 낚아채는 순간 바로 옆으로 다른 촉수가 내리꽂혔다.',
              'chapter 5 whole device drop',
          )
          replace_once(
              p,
              '은판으로 시선을 돌리자 귀 안쪽에서 낮은 울림이 계속됐고 손끝은 장갑을 두 겹 낀 것처럼 둔했으며, 코피가 윗입술까지 흘러내렸다.',
              '다시 세 촉수의 결속에 집중하자 귀 안쪽에서 낮은 울림이 계속됐고 손끝은 장갑을 두 겹 낀 것처럼 둔했으며, 코피가 윗입술까지 흘러내렸다.',
              'chapter 5 return to binding',
          )
          replace_once(
              p,
              '의무함 근처에서 누군가 “죽었어요?”라고 물었다. 넬라는 은판에서 손을 떼고 남아 있는 몸통과 촉수의 반응을 확인한 뒤 “네. 몸통 수축도 멈췄어요.”라고 답했다.',
              '의무함 근처에서 누군가 “죽었어요?”라고 물었다. 넬라는 결속을 끊고 남아 있는 몸통과 촉수의 반응을 확인한 뒤 “네. 몸통 수축도 멈췄어요.”라고 답했다.',
              'chapter 5 end binding',
          )

          # 9화: 의도적인 매체 비교·점검 예외임을 명시
          p = Path('원고/본문/09 한 장 40센티모.md')
          replace_once(
              p,
              '넬라는 자기 은침의를 열어 은판 하나를 반쯤 뽑아 옆에 놓았다. 은선은 평평한 판 위에서 갈라졌다 이어졌고 정시기 안의 태엽은 서로 다른 모양으로 구부러져 맞물렸다. 둘 다 배열을 보존하는 매체였다.',
              '매체의 구조를 비교해 보이려고 넬라는 자기 은침의를 열어 은판 하나를 반쯤 뽑아 옆에 놓았다. 은선은 평평한 판 위에서 갈라졌다 이어졌고 정시기 안의 태엽은 서로 다른 모양으로 구부러져 맞물렸다. 둘 다 배열을 보존하는 매체였다.',
              'chapter 9 deliberate comparison exception',
          )
          replace_once(
              p,
              '“은판은 펼쳐 놓고 선을 따라가니까 잘못 새긴 곳을 찾기 편해요.”',
              '“은판은 점검할 때 펼쳐 놓고 선을 따라가니까 잘못 새긴 곳을 찾기 편해요.”',
              'chapter 9 inspection context',
          )

          # 은침의 정본: 고정 장착 운용과 개방 예외를 명시
          p = Path('부유해파리도감의 설정과 전개/설정/장치/은침의.md')
          replace_once(
              p,
              '> 벡실리아 연금술사가 소지하는 장치. 안에 구문을 새긴 은판이 겹쳐 있고, 뚜껑의 바늘이 방위를 가리킨다.',
              '> 벡실리아 연금술사가 소지하는 장치. 안에 평소 운용할 은판 묶음이 장착되어 있고, 뚜껑의 바늘이 방위를 가리킨다.',
              'acularium summary',
          )
          replace_once(
              p,
              '## 은판\n\n은침의를 열면 은판이 겹쳐 있다. 한 장은 손바닥 절반 크기에 두께가 종이 서너 장이고, 판 위에 머리카락보다 가는 은선이 이어지고 갈라진다. 그 선이 이어지고 갈라지는 모양이 구문의 배열이다(제작과 수리는 [[구문]] 참고).\n\n구문 하나를 한 장에 다 새기지 못하는 때가 많다. 그런 구문은 판 여러 장에 나누어 새기고, 판과 판 사이에 짧은 은 다리를 끼워 선을 잇는다.\n\n판을 갈아 끼우는 것은 새 구문을 익혔을 때와 판이 상했을 때다. 평소에는 자기가 발동할 수 있는 구문의 판을 모두 넣고 다닌다. 두께가 그 연금술사가 지닌 구문의 수다. 3급의 은침의에는 판 스무 장 남짓이 들어가고, 특급은 수백 장을 여러 개에 나누어 지닌다.',
              '## 은판과 평상 운용\n\n은침의 안에는 은판 묶음이 겹쳐 장착되어 있다. 한 장은 손바닥 절반 크기에 두께가 종이 서너 장이고, 판 위에 머리카락보다 가는 은선이 이어지고 갈라진다. 그 선이 이어지고 갈라지는 모양이 구문의 배열이다(제작과 수리는 [[구문]] 참고).\n\n구문 하나를 한 장에 다 새기지 못하는 때가 많다. 그런 구문은 판 여러 장에 나누어 새기고, 판과 판 사이에 짧은 은 다리를 끼워 선을 잇는다.\n\n연금술사는 자기 전공과 생활에 맞춘 은판 묶음을 한 번 구성하면 그 상태로 장기간 운용한다. 구문을 실행할 때마다 뚜껑을 열거나 개별 은판을 골라 꺼내지 않는다. 닫힌 은침의 안에 장착된 배열을 읽고 대상에 결속해 실행한다. 은침의를 여는 때는 판의 점검·수리·교체, 새 배열의 추가, 필요 없어진 판의 폐기, 교육·시연·매체 비교처럼 판 자체를 다룰 필요가 있을 때다. 고장이나 구성 변경이 없으면 수십 년 동안 내부를 열지 않는 연금술사도 있다.\n\n판을 갈아 끼우는 것은 새 구문을 익혔을 때, 운용 구성을 바꿀 때와 판이 상했을 때다. 평소에는 자기가 발동할 수 있는 구문의 판을 모두 장착해 다닌다. 은침의의 두께는 보유 구문의 수와 복잡도를 함께 반영한다. 3급의 은침의에는 판 스무 장 남짓이 들어가고, 특급은 수백 장을 여러 개에 나누어 지닌다.',
              'acularium loadout canon',
          )

          # 구문 일반 정본에도 같은 운용 원리를 짧게 동기화
          p = Path('부유해파리도감의 설정과 전개/설정/구문/구문.md')
          replace_once(
              p,
              '은판은 표면에 밀랍으로 선을 그린 뒤 산에 담가 만든다. 밀랍이 덮은 자리의 은은 유지되고 나머지가 녹는다. 밀랍을 씻어내면 은선이 드러난다. 선을 끊을 때에는 바늘로 긁어내고, 이을 때에는 은가루 반죽을 발라 열을 가한다. 구문 한 편이 여러 판에 걸치면 판 사이에 짧은 은 다리를 끼워 선을 연결한다. 장치는 **[[은침의]]**다.',
              '은판은 표면에 밀랍으로 선을 그린 뒤 산에 담가 만든다. 밀랍이 덮은 자리의 은은 유지되고 나머지가 녹는다. 밀랍을 씻어내면 은선이 드러난다. 선을 끊을 때에는 바늘로 긁어내고, 이을 때에는 은가루 반죽을 발라 열을 가한다. 구문 한 편이 여러 판에 걸치면 판 사이에 짧은 은 다리를 끼워 선을 연결한다. 장치는 **[[은침의]]**다.\n\n완성된 은판 묶음은 은침의 안에 장기간 장착해 운용한다. 연금술사는 실행할 때마다 판을 꺼내 고르지 않으며, 점검·수리·교체·구성 변경·교육·시연·매체 비교 때에만 판을 드러낸다.',
              'syntax acularium operation',
          )

          # 연금술 전통 문서의 잘못된 생활 시전 예시 수정
          p = Path('부유해파리도감의 설정과 전개/설정/속성/구문 전통/연금술.md')
          replace_once(
              p,
              '소설 속에서도 모든 생활 연금술에 정식 구문명을 붙이거나 은판의 배열을 설명할 필요는 없다. `연금술로 말렸다`, `은판 하나를 밀어 넣자 금속이 식었다`처럼 결과와 물성을 먼저 보여 줄 수 있다. 복잡한 마법, 처음 보는 효과, 연구상 중요한 배열을 논할 때에는 개별 구문명과 구조를 따로 드러낸다.',
              '소설 속에서도 모든 생활 연금술에 정식 구문명을 붙이거나 은판의 배열을 설명할 필요는 없다. `연금술로 말렸다`, `손을 대자 금속의 열이 빠졌다`처럼 결과와 물성을 먼저 보여 줄 수 있다. 은침의는 평소 닫힌 채 운용하므로 일상적인 발동을 은판 선택·삽입 동작으로 묘사하지 않는다. 복잡한 마법, 처음 보는 효과, 연구상 중요한 배열을 논할 때에는 개별 구문명과 구조를 따로 드러낸다.',
              'alchemy tradition example',
          )

          # 설정·에피소드의 연관 표현 동기화
          p = Path('부유해파리도감의 설정과 전개/설정/인물/일행/테오도어 린트너.md')
          replace_once(
              p,
              '넬라는 은판은 펼쳐 놓고 은선을 따라가면 잘못된 자리를 찾기 쉽다고 말하고, 테오도어는 그 점을 편리하게 여긴다.',
              '넬라는 은판은 점검할 때 펼쳐 놓고 은선을 따라가면 잘못된 자리를 찾기 쉽다고 말하고, 테오도어는 그 점을 편리하게 여긴다.',
              'Theodor comparison context',
          )

          p = Path('부유해파리도감의 설정과 전개/이야기/에피소드/01 떼우산해파리와 첫 항해.md')
          replace_once(
              p,
              '준비해 둔 해파리 사역용 은판 묶음으로 가장자리 네 개체에 하강 신호를 기입하자',
              '은침의에 장착해 둔 해파리 사역 배열로 가장자리 네 개체에 하강 신호를 기입하자',
              'episode 1 loadout wording',
          )

          p = Path('부유해파리도감의 설정과 전개/설정/조직/벡실리아/벡실리아 대학.md')
          replace_once(
              p,
              '견습마다 작업대 하나를 배정받아 졸업할 때까지 자기 은침의에 넣을 은판을 새긴다.',
              '견습마다 작업대 하나를 배정받아 졸업할 때까지 자기 은침의에 장착할 은판을 새긴다.',
              'university loadout wording',
          )

          # 집필 원칙·체크·핵심 요약 동기화
          p = Path('원고/집필 원칙.md')
          replace_once(
              p,
              '- `[RULE:MEDIA-NORMAL-USE]` 인물은 기본적으로 각 전통의 매체를 사용해 마법을 쓴다. 무매체 사용은 가능한 예외이지 기본 사용법이 아니며 위력과 효율도 떨어진다.',
              '- `[RULE:MEDIA-NORMAL-USE]` 인물은 기본적으로 각 전통의 매체를 사용해 마법을 쓴다. 무매체 사용은 가능한 예외이지 기본 사용법이 아니며 위력과 효율도 떨어진다.\n- `[RULE:MEDIA-ACULARIUM-CLOSED-LOADOUT]` 은침의의 은판 묶음은 연금술사가 자기 전공과 생활에 맞춰 구성해 장기간 장착해 두는 개인 운용 환경이다. **일상적인 구문 실행 때마다 은침의를 열거나 개별 은판을 골라 꺼내지 않는다.** 닫힌 장치 안의 배열을 읽어 대상에 결속하고 실행한다. 은판의 물리적 조작은 점검·수리·교체·새 배열 추가·불필요한 판 폐기·교육·시연·매체 비교처럼 판 자체가 작업 대상일 때만 쓴다. 고장이나 구성 변경이 없으면 수십 년 동안 열지 않는 인물도 자연스럽다.',
              'writing rule acularium loadout',
          )
          replace_once(
              p,
              '68a. `[RULE:MAGIC-FOUNDATIONAL-LESSON]` 실제 기초수업이 이후 공통 문법을 세우는 목적이라면 당장 실습에서 쓰이지 않는 공통 개념까지 교과과정상 한 묶음으로 충분히 설명하게 두었는가?',
              '68a. `[RULE:MAGIC-FOUNDATIONAL-LESSON]` 실제 기초수업이 이후 공통 문법을 세우는 목적이라면 당장 실습에서 쓰이지 않는 공통 개념까지 교과과정상 한 묶음으로 충분히 설명하게 두었는가?\n68b. `[RULE:MEDIA-ACULARIUM-CLOSED-LOADOUT]` 일상 시전에서 은침의를 열거나 판을 골라 꺼내고 다시 넣는 동작을 만들지 않았는가? 판이 실제로 드러난다면 점검·수리·교체·구성 변경·교육·시연·매체 비교라는 장면상 이유가 분명한가?',
              'writing checklist acularium loadout',
          )
          replace_once(
              p,
              '실제 기초수업은 이후 공통 문법을 세우기 위해 당장 실습에서 쓰이지 않는 공통 개념까지 교과과정상 한 묶음으로 충분히 가르칠 수 있다. **같은 사실의 반복도',
              '실제 기초수업은 이후 공통 문법을 세우기 위해 당장 실습에서 쓰이지 않는 공통 개념까지 교과과정상 한 묶음으로 충분히 가르칠 수 있다. **은침의의 은판 묶음은 개인이 장기간 장착해 두는 운용 환경이며, 일상 시전에서 뚜껑을 열거나 판을 고르고 꺼내지 않는다. 판의 물리적 조작은 점검·수리·교체·구성 변경·교육·시연·매체 비교에 한정한다.** **같은 사실의 반복도',
              'writing summary acularium loadout',
          )

          # Temporary audit reports are no longer needed.
          for temp in (Path('은판 운용 감사.tmp.md'), Path('은판 운용 위험 표현 감사.tmp.md')):
              if temp.exists():
                  temp.unlink()

          # Residual exact-error audit in the completed manuscript.
          bad_phrases = [
              '은침의를 열어 평소 쓰던 해파리 사역용 은판 묶음을 골랐다',
              '은침의를 열었다. 겹친 구름 세 개',
              '익숙한 배열을 새긴 은판을 골라',
              '은판을 제자리로 넣었고',
              '은판 하나가 넬라 손에서 빠졌다',
              '은판을 낚아채 은침의에 밀어 넣는',
              '은선을 눌러 첫 가닥의 신호를 늦추자',
              '은판에서 손을 떼고',
          ]
          manuscript = '\n'.join(p.read_text(encoding='utf-8') for p in sorted(Path('원고/본문').glob('*.md')))
          remaining = [phrase for phrase in bad_phrases if phrase in manuscript]
          if remaining:
              raise RuntimeError(f'residual bad silver-plate phrasing: {remaining}')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/apply-acullarium-loadout-rule.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit \
            -m '개고(1·3·5·9화): 은침의 고정 장착 운용 정렬' \
            -m 'Rules: RULE:MEDIA-ACULARIUM-CLOSED-LOADOUT, RULE:MEDIA-NORMAL-USE, RULE:MEDIA-ROLE-SEPARATION, RULE:PROCESS-GLOBAL-PATTERN-AUDIT' \
            -m 'Reason: 은판은 시전 때마다 꺼내 고르는 카드가 아니라 은침의 안에 장기간 장착해 두는 개인 운용 환경이다.' \
            -m 'Changes: 1·3·5화의 판 선택·노출·재삽입 동작을 닫힌 장치의 배열 판독과 대상 결속으로 고쳤다. 9화의 개방은 매체 비교와 점검 예외로 명시하고, 은침의·구문·연금술·대학·에피소드·집필 원칙을 함께 동기화했다.'
          git push origin HEAD:main
