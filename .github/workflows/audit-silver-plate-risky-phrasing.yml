name: Audit risky silver plate phrasing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-silver-plate-risky-phrasing.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build risky phrasing report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              re.compile(r'은침의.{0,30}(열|닫|꺼내|뽑|고르|골라|밀어|넣)'),
              re.compile(r'(열|닫|꺼내|뽑|고르|골라|밀어|넣).{0,30}은침의'),
              re.compile(r'은판.{0,35}(골라|고르|꺼내|뽑|제자리|밀어 넣|손에서 빠|손을 떼|시선을 돌|눌러|펼쳐)'),
              re.compile(r'(골라|고르|꺼내|뽑|제자리|밀어 넣|손에서 빠|손을 떼|시선을 돌|눌러|펼쳐).{0,35}은판'),
              re.compile(r'은선을 눌'),
              re.compile(r'은판 묶음'),
          ]

          files = sorted(p for p in Path('.').rglob('*.md') if '.git' not in p.parts)
          out = ['# 은판 운용 위험 표현 전역 감사', '']
          hit_count = 0
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              hits = [i for i, line in enumerate(lines) if any(p.search(line) for p in patterns)]
              if not hits:
                  continue
              out.append(f'## {path.as_posix()}')
              out.append('')
              for i in hits:
                  hit_count += 1
                  a, b = max(0, i - 2), min(len(lines), i + 3)
                  out.append(f'### L{i+1}')
                  out.append('```text')
                  for j in range(a, b):
                      marker = '>>' if j == i else '  '
                      out.append(f'{marker} {j+1:04d}: {lines[j]}')
                  out.append('```')
                  out.append('')
          out.insert(2, f'검색 적중 줄 수: {hit_count}')
          out.insert(3, '')
          Path('은판 운용 위험 표현 감사.tmp.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm .github/workflows/audit-silver-plate-risky-phrasing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m '작업: 은판 운용 위험 표현 감사 결과 생성'
          git push origin HEAD:main
