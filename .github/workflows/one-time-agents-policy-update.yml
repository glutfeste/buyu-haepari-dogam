name: One-time AGENTS policy update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AGENTS policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          text = path.read_text(encoding='utf-8')

          branch_rules = '''- **`main`은 이 저장소의 유일한 작업 정본 브랜치다.** 사용자가 브랜치 생성을 명시적으로 지시한 경우에만 다른 브랜치를 만들 수 있다.
- 리뷰·백업·실험·발행·안전장치라는 이유로 에이전트가 임의로 브랜치를 만들지 않는다. 사용자가 매 작업에서 브랜치 생성을 금지하는 말을 반복하지 않았다는 사실을 허가로 해석하지 않는다.
- 비-`main` 브랜치를 과거 작업 보관소나 평행 정본으로 유지하지 않는다. 완료된 작업과 과거 상태는 Git 커밋·diff·revert 기록으로 확인한다.
'''
          anchor = '- pCloud 동기화에서 `.git`을 제외한다. Git 메타데이터는 C: 작업 폴더와 GitHub에 둔다.\n'
          if '**`main`은 이 저장소의 유일한 작업 정본 브랜치다.**' not in text:
              if anchor not in text:
                  raise SystemExit('Git section anchor not found')
              text = text.replace(anchor, anchor + branch_rules, 1)

          checklist_section = '''\n### 실행 체크리스트\n\n- 실행 체크리스트는 현재 작업 범위와 미완료 항목을 추적하는 임시 작업 파일이다. 작업 중에는 완료 항목을 `[x]`로 갱신한다.\n- 마지막 전역 감사까지 모든 항목을 완료하면 체크리스트 파일 자체를 즉시 삭제한다. 완료본·보관본·백업본·과거 체크리스트 사본을 저장소에 남기지 않는다.\n- 완료한 작업의 과거 이력은 Git 커밋과 diff에만 남긴다. 새 작업에서 과거 완료 체크리스트를 복원하거나 누적 작업일지로 키우지 않는다.\n- 새 작업에 체크리스트가 필요하면 현재 정본과 새 작업 범위를 기준으로 새 파일을 만든다. 활성 체크리스트가 있으면 작업 전에 처음부터 끝까지 읽고, 사용자가 보존 확정한 항목과 승인한 개고 범위를 그대로 따른다.\n\n'''
          numbered_anchor = '1. 작업을 시작하기 전에 `powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\scripts\\git-preflight.ps1`'
          if '### 실행 체크리스트' not in text:
              pos = text.find(numbered_anchor)
              if pos < 0:
                  raise SystemExit('numbered procedure anchor not found')
              text = text[:pos] + checklist_section + text[pos:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit policy and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- AGENTS.md
          git rm .github/workflows/one-time-agents-policy-update.yml
          git commit -m "작업원칙: main 단일 정본과 임시 체크리스트 운영 명시" -m "Reason: 에이전트가 명시적 허가 없이 브랜치를 누적하거나 완료된 체크리스트를 저장소에 남기는 일을 막는다." -m "Changes: main 단일 정본, 임의 브랜치 생성 금지, 체크리스트 완료 후 삭제, 과거 이력은 Git에만 보존하는 규칙을 AGENTS.md에 추가했다."
          git push origin HEAD:main
